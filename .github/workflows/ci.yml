name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on the oldest supported glibc baseline for wider compatibility.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add "$RUST_TARGET"
        env:
          RUST_TARGET: ${{ matrix.target }}
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        run: python -c 'import os, tomllib; version = tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]; assert os.environ["RELEASE_TAG"] == "v" + version, "tag must match Cargo.toml version"'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --target "$RUST_TARGET" -- -D warnings
        env:
          RUST_TARGET: ${{ matrix.target }}
      - name: Unit and CLI integration tests
        run: cargo test --locked --target "$RUST_TARGET"
        env:
          RUST_TARGET: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target "$RUST_TARGET"
        env:
          RUST_TARGET: ${{ matrix.target }}
      - name: Smoke-test release executable
        run: python -c 'import os, subprocess; exe = "whatdu.exe" if os.name == "nt" else "whatdu"; subprocess.run(["target/" + os.environ["RUST_TARGET"] + "/release/" + exe, "--version"], check=True)'
        env:
          RUST_TARGET: ${{ matrix.target }}
      - name: Terminal interaction tests (Unix PTY)
        if: runner.os != 'Windows'
        run: python tests/tui_delete.py
        env:
          WHATDU_BIN: ./target/${{ matrix.target }}/release/whatdu
      - name: Package binary, documentation, and checksums
        run: python scripts/package.py --target "$RUST_TARGET"
        env:
          RUST_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: whatdu-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: whatdu-*
          path: dist
          merge-multiple: true
      - name: Publish archives after all platform checks pass
        working-directory: dist
        run: |
          sha256sum --check *.sha256
          sha256sum *.tar.gz *.zip > SHA256SUMS
          gh release create "$RELEASE_TAG" *.tar.gz *.zip SHA256SUMS --repo "$RELEASE_REPO" --verify-tag --generate-notes --title "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
